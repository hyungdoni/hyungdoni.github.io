<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#101e39"><title>나만의 iPhone</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}button,input{font:inherit}button{cursor:pointer}#phone{position:relative;width:100%;height:100dvh;overflow:hidden;background:#152949;color:white;isolation:isolate}.wall{background:radial-gradient(ellipse 75% 50% at 5% 5%,#83b6e7 0%,transparent 80%),radial-gradient(ellipse 65% 60% at 90% 90%,#d27a83 0%,transparent 78%),linear-gradient(145deg,#0c1d3b,#385a89 58%,#14284d)}.screen{position:absolute;inset:0;display:none;flex-direction:column}.screen.active{display:flex}.island{position:absolute;z-index:20;top:calc(env(safe-area-inset-top) + 8px);left:50%;transform:translateX(-50%);width:116px;height:33px;border-radius:25px;background:#07080a;box-shadow:inset 0 0 2px #444;pointer-events:none}.island:after{content:'';position:absolute;right:13px;top:13px;width:7px;height:7px;background:#162e49;border-radius:50%}.status{position:absolute;z-index:19;top:calc(env(safe-area-inset-top) + 15px);left:8%;right:7%;display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:650;pointer-events:none}.status.dark{color:#1b2330}.homebar{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 7px);left:50%;transform:translateX(-50%);width:125px;height:5px;border-radius:10px;background:currentColor;z-index:30;opacity:.85;cursor:pointer}.light{color:white}.darkbar{color:#222}#lock{align-items:center;padding:calc(env(safe-area-inset-top) + 75px) 20px calc(env(safe-area-inset-bottom) + 40px);text-align:center}.lockIcon{font-size:22px}.lockDate{font-size:19px;margin-top:22px}.lockTime{font-size:clamp(75px,23vw,104px);font-weight:200;letter-spacing:-5px;line-height:1.2}.lockNotifs{width:100%;margin-top:65px;display:flex;flex-direction:column;gap:9px}.notif{border:0;width:100%;background:#eaf1f6d9;backdrop-filter:blur(24px);color:#222;border-radius:19px;padding:12px;display:flex;align-items:center;gap:10px;text-align:left;box-shadow:0 5px 15px #0002}.notif .ico{width:39px;height:39px;font-size:18px;flex-shrink:0}.notif small{display:block;color:#647184;margin-top:4px}.lockBottom{margin-top:auto;width:100%;display:flex;align-items:center;justify-content:space-between}.round{border:0;width:49px;height:49px;border-radius:50%;background:#2227;color:white;font-size:22px}.swipe{font-size:13px;color:#eee;margin-top:13px}#home{padding:calc(env(safe-area-inset-top) + 75px) 20px calc(env(safe-area-inset-bottom) + 26px)}.widgets{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:32px}.widget{min-height:145px;border-radius:25px;padding:16px;backdrop-filter:blur(20px);background:#ffffff28}.widget.weather{background:linear-gradient(145deg,#1a75cd,#3c9ce6)}.widget.calendar{background:#f9f9ff;color:#252a38}.widget .big{font-size:34px;font-weight:400;margin-top:12px}.widget .small{font-size:12px}.apps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:23px 8px}.app{background:none;border:0;color:white;display:flex;align-items:center;flex-direction:column;gap:6px;font-size:11px;position:relative}.ico{width:min(15vw,61px);height:min(15vw,61px);max-width:61px;max-height:61px;border-radius:17px;display:grid;place-items:center;font-size:30px;box-shadow:0 3px 8px #0002}.yellow{background:#fee500;color:#2b2300}.blue{background:linear-gradient(140deg,#8fe7ff,#0876d8)}.white{background:#fdfdfd;color:#24252a}.green{background:#35d364}.pink{background:#f65c84}.grey{background:#8897a9}.badge{position:absolute;top:-7px;right:8px;background:#ff3b30;border:2px solid white;border-radius:12px;padding:1px 6px;font-size:11px;display:none}.dock{margin-top:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:13px 5px;border-radius:27px;background:#ffffff45;backdrop-filter:blur(20px)}.dock .app{font-size:0}#list,#chat{background:#fff;color:#161a22}.nav{padding:calc(env(safe-area-inset-top) + 64px) 19px 12px;display:flex;align-items:center;justify-content:space-between}.nav h1{font-size:29px;letter-spacing:-1px;margin:0}.nav button,.chatnav button{background:none;border:0;font-size:22px;color:#242b37}.search{margin:0 16px 18px;border-radius:12px;background:#f0f1f4;color:#858995;padding:11px;font-size:14px}.chatRow{display:flex;align-items:center;gap:13px;padding:15px 18px;background:white;border:0;width:100%;text-align:left}.avatar{height:52px;width:52px;border-radius:20px;display:grid;place-items:center;background:#fee500;font-size:27px;flex-shrink:0}.chatRow .summary{flex:1;min-width:0}.summary strong{font-size:16px}.summary p{margin:5px 0 0;color:#8b8f99;font-size:13px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.chatRow time{font-size:11px;color:#9ca0aa}.tabs{margin-top:auto;display:flex;justify-content:space-around;border-top:1px solid #eee;padding:13px 0 calc(env(safe-area-inset-bottom) + 14px);color:#7c8190;font-size:12px}.tabs b{color:#151923}#chat{background:#b8cde2}.chatnav{padding:calc(env(safe-area-inset-top) + 53px) 15px 14px;display:flex;align-items:center;gap:15px}.chatnav strong{flex:1}.chatnav button{font-size:22px}#messages{flex:1;overflow-y:auto;padding:15px 13px;overscroll-behavior:contain}.day{text-align:center;font-size:11px;color:white;background:#7e98af70;border-radius:20px;width:max-content;padding:7px 13px;margin:0 auto 25px}.msg{display:flex;align-items:flex-end;gap:7px;margin-bottom:16px}.msg .avatar{height:36px;width:36px;font-size:21px;border-radius:13px}.msg .content{max-width:74%}.sender{font-size:12px;margin-bottom:6px}.bubble{background:white;border-radius:4px 15px 15px 15px;padding:10px 12px;font-size:15px;line-height:1.45;overflow-wrap:anywhere;white-space:pre-wrap}.msg.mine{justify-content:flex-end}.msg.mine .bubble{background:#fee500;border-radius:15px 4px 15px 15px}.stamp{font-size:10px;color:#536575;white-space:nowrap}.composer{display:flex;gap:10px;background:#f7f8fa;padding:10px 13px calc(env(safe-area-inset-bottom) + 15px)}.composer input{flex:1;min-width:0;background:white;border:1px solid #e2e3e8;border-radius:18px;padding:12px;font-size:16px}.composer button{background:#fee500;border:0;border-radius:12px;padding:0 15px}.banner{position:absolute;z-index:25;top:calc(env(safe-area-inset-top) + 56px);left:12px;right:12px;display:none}.banner .notif{box-shadow:0 10px 30px #0004}.hidden{display:none!important}@media(min-width:700px){body{background:#101116;display:grid;place-items:center}#phone{max-width:400px;max-height:860px;border-radius:46px;border:7px solid #333;box-shadow:0 20px 65px #0009}}
.talk-logo{display:block;width:83%;height:83%}.ico.yellow{background:#fee500!important;display:grid;place-items:center}.avatar{object-fit:cover;object-position:center;background-position:center;background-size:cover}.notif .ico{border-radius:12px}.notif-photo{width:43px;height:43px;flex-shrink:0;border-radius:13px;object-fit:cover;object-position:center;display:block}.lockNotifs .notif{min-height:68px}.notif strong{font-size:14px}.notif small{font-size:13px;line-height:1.4}</style></head><body><div id="phone"><div id="island" class="island"></div><div id="status" class="status"><span id="statusClock">9:41</span><span>▂▄▆  Wi-Fi  ▰</span></div>
<section id="lock" class="screen wall active"><div class="lockIcon">🔒</div><div class="lockDate" id="lockDate"></div><div class="lockTime" id="lockTime"></div><div id="lockNotifs" class="lockNotifs"></div><div class="lockBottom"><button class="round" onclick="tip('손전등은 시뮬레이션입니다')">♜</button><button class="round" onclick="tip('카메라는 시뮬레이션입니다')">◎</button></div><div class="swipe">위로 쓸어올려 잠금 해제</div></section>
<section id="home" class="screen wall"><div class="widgets"><div class="widget weather"><div class="small">☀️ 날씨</div><div class="big">22°</div><div class="small">맑음 · 데모 날씨</div></div><div class="widget calendar"><div class="small" id="weekday"></div><div class="big" id="daynum"></div><div class="small">오늘 할 일 없음</div></div></div><div class="apps"><button class="app" onclick="fake('FaceTime')"><span class="ico green">▣</span>FaceTime</button><button class="app" onclick="fake('캘린더')"><span class="ico white">📅</span>캘린더</button><button class="app" onclick="fake('사진')"><span class="ico white">🌼</span>사진</button><button class="app" onclick="fake('카메라')"><span class="ico grey">📷</span>카메라</button><button class="app" onclick="fake('메일')"><span class="ico blue">✉</span>메일</button><button class="app" onclick="fake('메모')"><span class="ico white">📝</span>메모</button><button class="app" onclick="fake('시계')"><span class="ico white">🕒</span>시계</button><button class="app" onclick="fake('지도')"><span class="ico white">🗺️</span>지도</button><button class="app" onclick="fake('설정')"><span class="ico grey">⚙</span>설정</button><button class="app" onclick="fake('App Store')"><span class="ico blue">A</span>App Store</button><button class="app" onclick="openKakao()"><span class="ico yellow"><svg class="talk-logo" viewBox="0 0 64 64" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><path fill="#301d13" d="M32 10C16.5 10 4 19.6 4 31.5c0 7.5 4.9 14 12.4 17.9L13.5 60l12.7-7.3c1.9.3 3.8.5 5.8.5 15.5 0 28-9.7 28-21.7S47.5 10 32 10Z"/><text x="32" y="36" text-anchor="middle" font-family="Arial,sans-serif" font-weight="900" font-size="13" fill="#fee500">TALK</text></svg></span><span class="badge" id="appBadge"></span>카카오톡</button><button class="app" onclick="fake('건강')"><span class="ico white">❤️</span>건강</button></div><div class="dock"><button class="app" onclick="fake('전화')"><span class="ico green">☎</span></button><button class="app" onclick="fake('Safari')"><span class="ico blue">🧭</span></button><button class="app" onclick="fake('메시지')"><span class="ico green">●</span></button><button class="app" onclick="fake('음악')"><span class="ico pink">♫</span></button></div></section>
<section id="list" class="screen"><div class="nav"><h1>채팅</h1><button onclick="go('home')">⌂</button></div><div class="search">⌕ 채팅 검색</div><button class="chatRow" onclick="openChat()"><img class="avatar" src="tyotyo.jpg?v=2" alt="툐툐 프로필"><span class="summary"><strong>툐툐</strong><p id="preview">아직 도착한 메시지가 없어요</p></span><time id="previewTime"></time><span id="unread" class="badge" style="position:static"></span></button><div class="tabs"><span>♙ 친구</span><b>▣ 채팅</b><span>◉ 오픈채팅</span><span>⋯ 더보기</span></div></section>
<section id="chat" class="screen"><div class="chatnav"><button onclick="go('list')">‹</button><strong>툐툐</strong><button onclick="go('home')">⌂</button></div><div id="messages"><div class="day" id="todayLabel">오늘</div></div><div class="composer"><input id="messageInput" placeholder="메시지를 입력하세요" autocomplete="off"><button id="send">전송</button></div></section>
<div id="banner" class="banner"><button class="notif" onclick="openChat()"><img class="notif-photo" src="tyotyo.jpg?v=2" alt="툐툐 프로필 사진"><span><strong>카카오톡 · 툐툐</strong><small id="bannerText"></small></span></button></div><div id="homebar" class="homebar light" role="button" aria-label="홈으로 이동" tabindex="0"></div></div>
<script>
const $=id=>document.getElementById(id);const repeatMessages=['꽁주 머해','왜 답장 안해 머하고 있어? 친구 만났어?','누나 설마 술 먹는 거 아니지?','꽁주'];const FIRST_DELAY=5000,REPEAT_INTERVAL=15000;let nextMessageIndex=0,nextMessageAt=Date.now()+FIRST_DELAY;const KEY='hyungdoni-iphone-tyotyo-v1';let state={started:Date.now(),messages:[],seen:0};try{const old=JSON.parse(localStorage.getItem(KEY));if(old&&Array.isArray(old.messages)&&typeof old.started==='number')state=old}catch(e){}let screen='lock',bannerTimer;function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}function clock(){const d=new Date();const t=d.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false});$('statusClock').textContent=t;$('lockTime').textContent=t;$('lockDate').textContent=d.toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'long'});$('weekday').textContent=d.toLocaleDateString('ko-KR',{weekday:'long'});$('daynum').textContent=d.getDate();$('todayLabel').textContent=d.toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric'});}clock();setInterval(clock,15000);
function go(id){screen=id;document.querySelectorAll('.screen').forEach(e=>e.classList.toggle('active',e.id===id));$('status').classList.toggle('dark',id==='list');$('homebar').className='homebar '+(id==='list'||id==='chat'?'darkbar':'light');$('banner').style.display='none';if(id==='chat'){state.seen=state.messages.filter(m=>!m.mine).length;save();render()}else updateBadge()}function openKakao(){go('list')}function openChat(){go('chat')}function fake(name){tip(name+'은(는) 아직 구현되지 않았어요')}function tip(message){$('bannerText').textContent=message;$('banner').style.display='block';clearTimeout(bannerTimer);bannerTimer=setTimeout(()=>$('banner').style.display='none',3500)}function updateBadge(){const n=Math.max(0,state.messages.filter(m=>!m.mine).length-state.seen);for(const id of ['appBadge','unread']){$(id).textContent=n>99?'99+':n;$(id).style.display=n?'inline-block':'none'}const last=state.messages.at(-1);$('preview').textContent=last?last.text:'아직 도착한 메시지가 없어요';$('previewTime').textContent=last?new Date(last.at).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}):'';}
function render(){const box=$('messages');box.replaceChildren($('todayLabel'));for(const m of state.messages){const row=document.createElement('div');row.className='msg'+(m.mine?' mine':'');if(!m.mine){const av=document.createElement('span');av.className='avatar';av.style.backgroundImage="url('tyotyo.jpg?v=2')";av.style.backgroundSize='cover';av.style.backgroundPosition='center';row.append(av)}const content=document.createElement('div');content.className='content';if(!m.mine){const name=document.createElement('div');name.className='sender';name.textContent='툐툐';content.append(name)}const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=m.text;content.append(bubble);const stamp=document.createElement('span');stamp.className='stamp';stamp.textContent=new Date(m.at).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});row.append(content,stamp);box.append(row)}box.scrollTop=box.scrollHeight;updateBadge()}
function receive(text){state.messages.push({id:'repeat-'+Date.now()+'-'+Math.random().toString(36).slice(2),text,at:Date.now(),mine:false});save();render();if(screen!=='chat'){tip(text);if(screen==='lock')lockNotifications()}}
function lockNotifications(){const box=$('lockNotifs');box.replaceChildren();const latest=state.messages.filter(m=>!m.mine).slice(-3).reverse();for(const m of latest){const btn=document.createElement('button');btn.className='notif';const icon=document.createElement('img');icon.className='notif-photo';icon.src='tyotyo.jpg?v=2';icon.alt='툐툐 프로필 사진';const info=document.createElement('span');const title=document.createElement('strong');title.textContent='카카오톡 · 툐툐';const desc=document.createElement('small');desc.textContent=m.text;info.append(title,desc);btn.append(icon,info);btn.onclick=()=>{go('home');openChat()};box.append(btn)}}
function send(){const text=$('messageInput').value.trim();if(!text)return;state.messages.push({id:'mine-'+Date.now()+'-'+Math.random(),text,at:Date.now(),mine:true});$('messageInput').value='';save();render()}$('send').onclick=send;$('messageInput').addEventListener('keydown',e=>{if(e.key==='Enter')send()});
let touchY=null;$('lock').addEventListener('touchstart',e=>{touchY=e.touches[0].clientY},{passive:true});$('lock').addEventListener('touchend',e=>{if(touchY!==null&&touchY-e.changedTouches[0].clientY>55)go('home');touchY=null},{passive:true});$('lock').addEventListener('click',e=>{if(e.target.closest('.notif,.round'))return;go('home')});$('homebar').onclick=()=>go('home');$('homebar').onkeydown=e=>{if(e.key==='Enter')go('home')};
function checkSchedule(){if(Date.now()<nextMessageAt)return;receive(repeatMessages[nextMessageIndex]);nextMessageIndex=(nextMessageIndex+1)%repeatMessages.length;nextMessageAt=Date.now()+REPEAT_INTERVAL;}render();lockNotifications();checkSchedule();setInterval(checkSchedule,1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden){clock();checkSchedule()}});
</script></body></html>
