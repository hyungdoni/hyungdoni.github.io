<div id="incomingCall" role="dialog" aria-modal="true" aria-label="툐툐에게서 전화가 옵니다"><div class="call-name">툐툐 💛</div><div class="call-subtitle" id="callSubtitle">휴대전화에서 걸려오는 중...</div><div class="call-spacer"></div><div class="call-result" id="callResult"></div><div class="call-tools" id="callTools"><button type="button" onclick="dismissCall('나중에 보기')"><span style="font-size:25px">◷</span>나중에 보기</button><button type="button" onclick="dismissCall('메시지')"><span style="font-size:25px">▤</span>메시지</button></div><div class="call-actions" id="callActions"><button type="button" onclick="dismissCall('거절')"><span class="call-round decline">☎</span>거절</button><button type="button" onclick="answerCall()"><span class="call-round answer">☎</span>응답</button></div></div><div id="banner" class="banner"><button class="notif" onclick="screen==='lock'?requestUnlock():screen==='passcode'?void(0):openChat()"><img class="notif-photo" src="tyotyo.jpg?v=2" alt="툐툐 프로필 사진"><span><strong>카카오톡 · 툐툐</strong><small id="bannerText"></small></span></button></div><div id="homebar" class="homebar light" role="button" aria-label="홈으로 이동" tabindex="0"></div></div>
<script>
const $=id=>document.getElementById(id);const repeatMessages=['꽁주 머해','왜 답장 안해 머하고 있어? 친구 만났어?','누나 설마 술 먹는 거 아니지?','꽁주'];const FIRST_DELAY=5000,REPEAT_INTERVAL=5000;let nextMessageIndex=0,nextMessageAt=Date.now()+FIRST_DELAY;const KEY='hyungdoni-iphone-tyotyo-v1';let state={started:Date.now(),messages:[],seen:0};try{localStorage.removeItem(KEY)}catch(e){}let screen='lock',bannerTimer;function save(){/* 대화는 이번 방문 동안에만 유지합니다. */}function clock(){const d=new Date();const t=d.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false});$('statusClock').textContent=t;$('lockTime').textContent=t;$('lockDate').textContent=d.toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'long'});$('weekday').textContent=d.toLocaleDateString('ko-KR',{weekday:'long'});$('daynum').textContent=d.getDate();$('todayLabel').textContent=d.toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric'});}clock();setInterval(clock,15000);
function go(id){screen=id;document.querySelectorAll('.screen').forEach(e=>e.classList.toggle('active',e.id===id));$('status').classList.toggle('dark',id==='list');$('homebar').className='homebar '+(id==='list'||id==='chat'?'darkbar':'light');$('banner').style.display='none';if(id==='chat'){state.seen=state.messages.filter(m=>!m.mine).length;save();render()}else updateBadge()}function openOldChat(){go('oldchat')}function openCamera(){go('cameraView')}function openKakao(){go('list')}function openChat(){go('chat')}function fake(name){tip(name+'은(는) 아직 구현되지 않았어요')}function tip(message){$('bannerText').textContent=message;$('banner').style.display='block';clearTimeout(bannerTimer);bannerTimer=setTimeout(()=>$('banner').style.display='none',3500)}function updateBadge(){const n=Math.max(0,state.messages.filter(m=>!m.mine).length-state.seen);for(const id of ['appBadge','unread']){$(id).textContent=n>99?'99+':n;$(id).style.display=n?'inline-block':'none'}const last=state.messages.at(-1);$('preview').textContent=last?last.text:'아직 도착한 메시지가 없어요';$('previewTime').textContent=last?new Date(last.at).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}):'';}
function render(){const box=$('messages');box.replaceChildren($('todayLabel'));for(const m of state.messages){const row=document.createElement('div');row.className='msg'+(m.mine?' mine':'');if(!m.mine){const av=document.createElement('span');av.className='avatar';av.style.backgroundImage="url('tyotyo.jpg?v=2')";av.style.backgroundSize='cover';av.style.backgroundPosition='center';row.append(av)}const content=document.createElement('div');content.className='content';if(!m.mine){const name=document.createElement('div');name.className='sender';name.textContent='툐툐';content.append(name)}const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=m.text;content.append(bubble);const stamp=document.createElement('span');stamp.className='stamp';stamp.textContent=new Date(m.at).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});row.append(content,stamp);box.append(row)}box.scrollTop=box.scrollHeight;updateBadge()}
function receive(text){state.messages.push({id:'repeat-'+Date.now()+'-'+Math.random().toString(36).slice(2),text,at:Date.now(),mine:false});save();render();if(screen!=='chat'){if(screen!=='passcode')tip(text);if(screen==='lock')lockNotifications()}}
function lockNotifications(){const box=$('lockNotifs');box.replaceChildren();const latest=state.messages.filter(m=>!m.mine).slice(-3).reverse();for(const m of latest){const btn=document.createElement('button');btn.className='notif';const icon=document.createElement('img');icon.className='notif-photo';icon.src='tyotyo.jpg?v=2';icon.alt='툐툐 프로필 사진';const info=document.createElement('span');const title=document.createElement('strong');title.textContent='카카오톡 · 툐툐';const desc=document.createElement('small');desc.textContent=m.text;info.append(title,desc);btn.append(icon,info);btn.onclick=()=>requestUnlock();box.append(btn)}}
function send(){const input=$('messageInput');const text=input.value.trim();if(!text)return;state.messages.push({id:'mine-'+Date.now(),text,at:Date.now(),mine:true});input.value='';render()};$('send').onclick=send;$('messageInput').addEventListener('keydown',e=>{if(e.key==='Enter')send()});
let touchY=null,passValue='';
function requestUnlock(){if(screen==='lock'){passValue='';$('passError').textContent='';paintDots();go('passcode')}}
function paintDots(){document.querySelectorAll('.pass-dot').forEach((el,i)=>el.classList.toggle('filled',i<passValue.length))}
function pressDigit(d){if(screen!=='passcode'||passValue.length>=4)return;passValue+=d;paintDots();if(passValue.length===4){if(passValue==='0511'){passValue='';go('home')}else{$('passError').textContent='암호가 틀렸습니다';setTimeout(()=>{passValue='';paintDots()},500)}}}
document.querySelectorAll('[data-digit]').forEach(b=>b.addEventListener('click',()=>pressDigit(b.dataset.digit)));
$('passDelete').addEventListener('click',()=>{passValue=passValue.slice(0,-1);paintDots();$('passError').textContent=''});
$('passCancel').addEventListener('click',()=>go('lock'));
document.addEventListener('keydown',e=>{if(screen!=='passcode')return;if(/^\d$/.test(e.key))pressDigit(e.key);else if(e.key==='Backspace'){$('passDelete').click()}});
$('lock').addEventListener('touchstart',e=>{touchY=e.touches[0].clientY},{passive:true});
$('lock').addEventListener('touchend',e=>{if(touchY!==null&&touchY-e.changedTouches[0].clientY>45)requestUnlock();touchY=null},{passive:true});
$('lock').addEventListener('click',e=>{if(e.target.closest('.notif,.round'))return;requestUnlock()});
$('homebar').onclick=()=>screen==='lock'?requestUnlock():screen==='passcode'?go('lock'):go('home');
$('homebar').onkeydown=e=>{if(e.key==='Enter')$('homebar').click()};
function checkSchedule(){if(nextMessageIndex>=repeatMessages.length||Date.now()<nextMessageAt)return;receive(repeatMessages[nextMessageIndex]);nextMessageIndex++;nextMessageAt=Date.now()+REPEAT_INTERVAL;}render();lockNotifications();checkSchedule();setInterval(checkSchedule,1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden){clock();checkSchedule()}});

const albumPhotos=Array.from({length:10},(_,i)=>'album_'+String(i+1).padStart(2,'0')+'.jpg');let photoIndex=0;
function openAlbum(){const grid=$('albumGrid');if(!grid.children.length){albumPhotos.forEach((file,i)=>{const button=document.createElement('button');button.type='button';button.setAttribute('aria-label',`사진 ${i+1} 보기`);const img=document.createElement('img');img.src=file;img.alt=`툐툐 사진 ${i+1}`;img.loading='lazy';button.append(img);button.onclick=()=>showPhoto(i);grid.append(button)})}go('album')}
function showPhoto(i){photoIndex=(i+albumPhotos.length)%albumPhotos.length;$('viewerImg').src=albumPhotos[photoIndex];$('photoCount').textContent=(photoIndex+1)+' / '+albumPhotos.length;go('photoViewer')}
function movePhoto(step){showPhoto(photoIndex+step)}
let viewerTouchX=null;$('viewerTouch').addEventListener('touchstart',e=>{viewerTouchX=e.touches[0].clientX},{passive:true});$('viewerTouch').addEventListener('touchend',e=>{if(viewerTouchX===null)return;const dx=e.changedTouches[0].clientX-viewerTouchX;if(Math.abs(dx)>45)movePhoto(dx<0?1:-1);viewerTouchX=null},{passive:true});

// A single incoming-call simulation, 30 seconds after page load.
const callDueAt=Date.now()+30000;
let callTriggered=false,callOpen=false,callAnswered=false,callAudio=null,ringLoop=null;
function stopRinging(){if(ringLoop){clearInterval(ringLoop);ringLoop=null}if(callAudio){try{callAudio.close()}catch(e){}callAudio=null}}
function ringOnce(){try{const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return;if(!callAudio)callAudio=new Ctx();if(callAudio.state==='suspended')callAudio.resume();for(let j=0;j<2;j++){let o=callAudio.createOscillator(),g=callAudio.createGain(),t=callAudio.currentTime+j*.3;o.type='sine';o.frequency.value=740;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.08,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+.22);o.connect(g);g.connect(callAudio.destination);o.start(t);o.stop(t+.24)}}catch(e){}}
function showIncomingCall(){if(callTriggered)return;callTriggered=true;callOpen=true;$('incomingCall').classList.add('show');ringOnce();ringLoop=setInterval(ringOnce,2300)}
let callEndTimer=null,callClockTimer=null,callStartedAt=0,postCallSent=false;
function dismissCall(reason){
  stopRinging();clearTimeout(callEndTimer);clearInterval(callClockTimer);
  const wasAnswered=callAnswered;
  callOpen=false;callAnswered=false;
  $('incomingCall').classList.remove('show');
  if(wasAnswered&&!postCallSent){
    postCallSent=true;
    receive('형들 없는 곳에서 전화 받아');
  }
  if(reason==='메시지'&&screen!=='passcode'&&screen!=='lock')openChat();
}
function answerCall(){
  if(callAnswered)return;
  stopRinging();callAnswered=true;callStartedAt=Date.now();
  $('callSubtitle').textContent='00:00';
  $('callResult').style.display='none';
  $('callTools').style.display='grid';
  $('callTools').classList.add('connected');
  $('callTools').innerHTML=`<button type="button" onclick="toggleCallButton(this)" aria-label="음소거"><span class="call-tool-circle">♩̸</span>음소거</button><button type="button" onclick="toggleCallButton(this)" aria-label="키패드"><span class="call-tool-circle">⠿</span>키패드</button><button type="button" onclick="toggleCallButton(this)" class="selected" aria-label="스피커"><span class="call-tool-circle">◖))</span>스피커</button><button type="button" onclick="toggleCallButton(this)" aria-label="통화 추가"><span class="call-tool-circle">＋</span>추가</button><button type="button" onclick="toggleCallButton(this)" aria-label="FaceTime"><span class="call-tool-circle">▣</span>FaceTime</button><button type="button" onclick="toggleCallButton(this)" aria-label="연락처"><span class="call-tool-circle">◎</span>연락처</button>`;
  $('callActions').classList.add('connected');
  $('callActions').innerHTML=`<button type="button" onclick="dismissCall('통화 종료')"><span class="call-round decline">☎</span>통화 종료</button>`;
  callClockTimer=setInterval(()=>{
    const seconds=Math.floor((Date.now()-callStartedAt)/1000);
    $('callSubtitle').textContent='00:'+String(seconds).padStart(2,'0');
  },250);
  callEndTimer=setTimeout(()=>dismissCall('자동 통화 종료'),4000);
}
function toggleCallButton(btn){btn.classList.toggle('selected')}
function checkIncomingCall(){if(!callTriggered&&Date.now()>=callDueAt)showIncomingCall()}
setInterval(checkIncomingCall,500);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkIncomingCall()});
</script></body></html>
