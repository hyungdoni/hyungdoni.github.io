<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>카카오톡 스타일 채팅</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: #bacee0;
  color: #222;
}
.app {
  max-width: 480px;
  height: 100dvh;
  margin: auto;
  display: flex;
  flex-direction: column;
  background: #bacee0;
}
header {
  background: #f9f9f9;
  padding: 18px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid #ddd;
}
.back { font-size: 25px; }
.avatar {
  width: 42px; height: 42px;
  border-radius: 16px;
  background: #fee500;
  display: grid;
  place-items: center;
  font-size: 22px;
}
.name { font-weight: 700; }
.status { font-size: 12px; color: #777; margin-top: 4px; }
#messages {
  flex: 1;
  overflow-y: auto;
  padding: 18px 12px;
}
.day {
  text-align: center;
  color: white;
  font-size: 12px;
  margin: 8px 0 22px;
}
.message {
  display: flex;
  gap: 8px;
  margin-bottom: 17px;
  align-items: flex-end;
}
.message .avatar {
  width: 34px; height: 34px;
  font-size: 18px;
  flex-shrink: 0;
}
.content { max-width: 78%; }
.sender { font-size: 12px; margin-bottom: 6px; }
.bubble {
  background: white;
  padding: 10px 12px;
  border-radius: 3px 14px 14px 14px;
  font-size: 15px;
  line-height: 1.45;
  overflow-wrap: anywhere;
}
.time {
  font-size: 10px;
  color: #555;
  white-space: nowrap;
}
.mine {
  justify-content: flex-end;
}
.mine .bubble {
  background: #fee500;
  border-radius: 14px 3px 14px 14px;
}
.notice {
  text-align: center;
  color: #526577;
  font-size: 12px;
  margin: 16px 0;
}
footer {
  display: flex;
  gap: 8px;
  padding: 10px;
  background: #f7f7f7;
}
input {
  flex: 1;
  min-width: 0;
  border: 1px solid #ddd;
  border-radius: 20px;
  padding: 12px;
  font-size: 15px;
}
button {
  border: 0;
  border-radius: 12px;
  padding: 0 16px;
  background: #fee500;
  font-weight: bold;
}
</style>
</head>
<body>
<div class="app">
  <header>
    <span class="back">‹</span>
    <div class="avatar">💬</div>
    <div>
      <div class="name">친구</div>
      <div class="status" id="status">메시지를 기다리는 중</div>
    </div>
  </header>

  <main id="messages">
    <div class="day">오늘</div>
  </main>

  <footer>
    <input id="input" placeholder="메시지를 입력하세요"
           autocomplete="off">
    <button id="send">전송</button>
  </footer>
</div>

<script>
const messages = document.getElementById("messages");
const input = document.getElementById("input");
const status = document.getElementById("status");

// 자동으로 도착할 메시지와 도착 시간(밀리초)
const schedule = [
  { delay: 5000, text: "안녕! 😊" },
  { delay: 15000, text: "지금 뭐 해?" },
  { delay: 30000, text: "오늘 하루 어땠어?" },
  { delay: 50000, text: "나랑 얘기 좀 하자 ㅎㅎ" }
];

function addMessage(text, mine = false) {
  const row = document.createElement("div");
  row.className = "message" + (mine ? " mine" : "");

  const content = document.createElement("div");
  content.className = "content";

  if (!mine) {
    const sender = document.createElement("div");
    sender.className = "sender";
    sender.textContent = "친구";
    content.appendChild(sender);
  }

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;

  const time = document.createElement("span");
  time.className = "time";
  time.textContent = new Date().toLocaleTimeString("ko-KR", {
    hour: "2-digit",
    minute: "2-digit"
  });

  content.appendChild(bubble);
  row.append(content, time);
  messages.appendChild(row);
  messages.scrollTop = messages.scrollHeight;
}

schedule.forEach(item => {
  setTimeout(() => {
    addMessage(item.text);
    status.textContent = "새 메시지가 도착했어요";
  }, item.delay);
});

function sendMessage() {
  const text = input.value.trim();
  if (!text) return;
  addMessage(text, true);
  input.value = "";
  status.textContent = "메시지를 보냈어요";
  input.focus();
}

document.getElementById("send").addEventListener("click", sendMessage);
input.addEventListener("keydown", event => {
  if (event.key === "Enter") sendMessage();
});
</script>
</body>
</html>
